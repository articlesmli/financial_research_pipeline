name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --- CONTINUOUS INTEGRATION (CI) ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          OLLAMA_MODEL: llama3
        run: pytest tests/

  # --- CONTINUOUS DEPLOYMENT (CD - BUILD & PUSH) ---
  deploy-docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}

  # --- CONTINUOUS DEPLOYMENT (CD - PRODUCTION SERVER) ---
  deploy-server:
    needs: deploy-docker
    runs-on: self-hosted
    environment: production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Secure SSH Agent & Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Start ssh-agent and register private key securely
          eval $(ssh-agent -s)
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          
          # Register target VM host key securely
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          # Ensure target directory exists and copy docker-compose.yaml
          ssh "$SSH_USER@$SERVER_IP" "mkdir -p ~/my-app"
          scp docker-compose.yaml "$SSH_USER@$SERVER_IP:~/my-app/docker-compose.yaml"

          # Execute remote deployment over SSH
          ssh "$SSH_USER@$SERVER_IP" << 'EOF'
            set -e
            cd ~/my-app
            
            echo "Pulling latest images from GHCR..."
            docker compose pull
            
            echo "Restarting containers..."
            docker compose up -d --remove-orphans
            
            echo "Deployment completed successfully!"
          EOF