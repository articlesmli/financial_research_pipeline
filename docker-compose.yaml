version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: financial_backend
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./pipeline_audit.db}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    networks:
      - app-net
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: financial_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8001/analyze
    networks:
      - app-net
    depends_on:
      - backend
    restart: always

networks:
  app-net:
    driver: bridge